services:
  keycloak:
    image: ${KEYCLOAK_REGISTRY_PREFIX:-${REGISTRY_PREFIX:-}}quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: localhost
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && grep -q 'UP' <&3"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
        NEXUS_PYPI_URL: ${NEXUS_PYPI_URL:-}
    environment:
      KEYCLOAK_URL: http://host.docker.internal:8080
      KEYCLOAK_REALM: demo
      KEYCLOAK_CLIENT_ID: vue-frontend
      KEYCLOAK_ISSUER: http://localhost:8080/realms/demo
    ports:
      - "8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
        NEXUS_NPM_URL: ${NEXUS_NPM_URL:-}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  keycloak_data:
